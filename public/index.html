<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HSA Portfolio</title>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/index-MEg2kOVE.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Cgpt1u_E.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      const wakeBackend = () => {
        const img = new Image();
        const timestamp = new Date().getTime();
        img.src = `https://haider530.app.n8n.cloud/webhook/wake-backend?t=${timestamp}&source=portfolio&page=${encodeURIComponent(
          window.location.pathname
        )}`;
        img.onload = () => console.log("Backend wake-up successful");
        img.onerror = () => console.log("Backend wake-up failed");
      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", wakeBackend);
      } else {
        wakeBackend();
      }
    </script>
  </body>
</html>
